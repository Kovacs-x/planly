<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111215" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Planly" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Planly</title>
  <style>
    :root{--bg:#f7f7f9;--card:#fff;--text:#111215;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--accentText:#fff;--danger:#b91c1c;--shadow:0 8px 30px rgba(0,0,0,.06)}
    :root[data-theme="dark"]{--bg:#111215;--card:#191b20;--text:#f9fafb;--muted:#9ca3af;--line:#2b2e35;--accent:#f3f4f6;--accentText:#111215;--danger:#f87171;--shadow:none}
    *{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif} body{min-height:100vh}
    button,input,select,textarea{font:inherit} button{cursor:pointer}
    .app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(92px + env(safe-area-inset-bottom))}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.eyebrow{color:var(--muted);font-size:13px}.title{font-size:30px;line-height:1.05;font-weight:800;margin:2px 0 0}.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text)}
    .progress{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:16px}.progressRow{display:flex;justify-content:space-between;align-items:center}.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}.bar>span{display:block;height:100%;background:var(--accent);border-radius:999px;width:0;transition:.2s}
    .section{margin-top:18px}.sectionHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sectionHead h2{font-size:17px;margin:0}.muted{color:var(--muted)}
    .task{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:transparent}.task.done .taskTitle{text-decoration:line-through;color:var(--muted)}.taskTitle{font-weight:650;line-height:1.3}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px;font-size:12px;color:var(--muted)}.pill{padding:4px 8px;border-radius:999px;background:color-mix(in srgb,var(--line) 65%,transparent)}.taskActions{display:flex;gap:6px}.smallbtn{min-width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text)}
    .empty{padding:26px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.fab{position:fixed;right:max(20px,calc((100vw - 720px)/2 + 20px));bottom:calc(84px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accentText);font-size:30px;box-shadow:0 10px 25px rgba(0,0,0,.18)}
    .nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,720px);display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:20}.nav button{min-height:50px;border:0;background:transparent;color:var(--muted);font-size:12px;border-radius:14px}.nav button.active{background:var(--bg);color:var(--text);font-weight:700}
    .sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:30}.sheetWrap.open{display:flex}.sheet{width:min(100%,720px);margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.handle{width:42px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}.field{margin-bottom:12px}.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}.input,.select,.textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:12px 13px;outline:none}.textarea{min-height:84px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:9px 12px}.chip.active{background:var(--accent);color:var(--accentText);border-color:var(--accent)}.primary{width:100%;min-height:50px;border:0;border-radius:15px;background:var(--accent);color:var(--accentText);font-weight:700}.danger{color:var(--danger)}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow,.day{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:13px}.dow{aspect-ratio:auto;color:var(--muted);font-size:11px}.day{border:1px solid transparent}.day.has{background:var(--card);border-color:var(--line)}.day.selected{background:var(--accent);color:var(--accentText)}.weekStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekDay{padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);text-align:center}.weekDay.selected{background:var(--accent);color:var(--accentText)}.weekDay small{display:block;color:inherit;opacity:.7}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.toolbar button{min-height:40px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:0 12px}.settingsCard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.settingsCard h3{margin:0 0 10px;font-size:16px}.installHelp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
    @media(min-width:700px){.fab{right:calc((100vw - 720px)/2 + 22px)}}
  </style>
</head>
<body>
<div class="app">
  <div id="installHelp" class="installHelp" hidden><strong>Add Planly to your iPhone</strong><div class="muted" style="margin-top:6px;font-size:14px">Open in Safari → Share → Add to Home Screen.</div></div>
  <header class="topbar"><div><div id="eyebrow" class="eyebrow"></div><div id="pageTitle" class="title">Today</div></div><button id="themeToggle" class="iconbtn" aria-label="Toggle theme">◐</button></header>
  <main id="view"></main>
</div>
<button id="addBtn" class="fab" aria-label="Add task">+</button>
<nav class="nav">
  <button data-tab="today" class="active">Today</button><button data-tab="week">Week</button><button data-tab="month">Month</button><button data-tab="inbox">Inbox</button><button data-tab="settings">Settings</button>
</nav>

<div id="sheetWrap" class="sheetWrap" aria-hidden="true"><div class="sheet"><div class="handle"></div><form id="taskForm">
  <input type="hidden" id="taskId"><div class="field"><label for="taskTitle">Task</label><input id="taskTitle" class="input" maxlength="160" required placeholder="What needs doing?"></div>
  <div class="chips" id="quickDates"><button type="button" class="chip active" data-q="today">Today</button><button type="button" class="chip" data-q="tomorrow">Tomorrow</button><button type="button" class="chip" data-q="nextweek">Next week</button><button type="button" class="chip" data-q="none">No date</button></div>
  <div class="row2" style="margin-top:12px"><div class="field"><label>Date</label><input id="taskDate" type="date" class="input"></div><div class="field"><label>Time</label><input id="taskTime" type="time" class="input"></div></div>
  <div class="row2"><div class="field"><label>Priority</label><select id="taskPriority" class="select"><option value="normal">Normal</option><option value="high">High</option><option value="low">Low</option></select></div><div class="field"><label>Category</label><select id="taskCategory" class="select"><option>Personal</option><option>Work</option><option>Home</option><option>Health</option><option>Finance</option><option>Errands</option></select></div></div>
  <div class="row2"><div class="field"><label>Repeat</label><select id="taskRepeat" class="select"><option value="none">None</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></div><div class="field"><label>Reminder</label><select id="taskReminder" class="select"><option value="none">None</option><option value="at-time">At task time</option></select></div></div>
  <div class="field"><label>Notes</label><textarea id="taskNotes" class="textarea" maxlength="500" placeholder="Optional details"></textarea></div>
  <div class="row2"><button type="button" id="deleteTask" class="primary" style="background:transparent;color:var(--danger);border:1px solid var(--line);display:none">Delete</button><button type="submit" class="primary">Save task</button></div>
</form></div></div>
<input id="importFile" type="file" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
