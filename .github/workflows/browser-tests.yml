name: Browser regression tests
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'tests/browser/**'
      - '.github/workflows/browser-tests.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (not committed; no package.json in this repo)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Projects — bottom tabs always work (candidate)
        run: node tests/browser/projects-tabs.test.mjs
      - name: Repeating tasks with no date come back (candidate)
        run: node tests/browser/undated-repeats.test.mjs
      - name: Fitness › Food — private calorie counter (candidate)
        run: node tests/browser/fitness-food.test.mjs
      - name: Fitness › Food — barcode scanner with a fake camera (candidate)
        run: node tests/browser/fitness-scan.test.mjs
      - name: Fitness › Food — search through Planly's food-search function (candidate)
        run: node tests/browser/fitness-search-proxy.test.mjs
      - name: Update banner — Update while editing warns, then updates (candidate)
        run: node tests/browser/update-banner.test.mjs
      - name: Sync conflicts — combined automatically when safe; a real clash waits for a choice (candidate)
        run: node tests/browser/sync-conflicts.test.mjs
      - name: Household chores offline — partner's ticks and completions survive a restart and replay through the household RPCs (candidate)
        run: node tests/browser/household-offline.test.mjs
      - name: Budget tab — Me/Household, month bar, category, add/pay/delete, scroll kept, set-up card (candidate)
        run: node tests/browser/budget-tab.test.mjs
      - name: Render steps — every tab draws through its step, same-turn renders draw once, diagnostics opt-in (candidate)
        run: node tests/browser/render-steps.test.mjs
      - name: Budget totals after deleting — a deleted category's payments, a deleted or changed payment, Me and Household (candidate)
        run: node tests/browser/budget-delete.test.mjs
      - name: Task sheet sharing — Share and Assign, the sync-ready gate, read-only shared task, duplicate, foreground resume (candidate)
        run: node tests/browser/task-sharing.test.mjs
      - name: Household live updates — private channel join, broadcast brings the other phone's change in, leave on pagehide, rejoin on return (candidate)
        run: node tests/browser/household-live.test.mjs
      - name: Same test against the base branch (for comparison only; not a gate)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p "$RUNNER_TEMP/base" && git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/base"
          PLANLY_ROOT="$RUNNER_TEMP/base" node tests/browser/projects-tabs.test.mjs | tail -1 || true
          PLANLY_ROOT="$RUNNER_TEMP/base" node tests/browser/undated-repeats.test.mjs | tail -1 || true
