name: Browser regression tests
on:
  pull_request:
    paths:
      - 'v2/**'
      - 'tests/browser/**'
      - '.github/workflows/browser-tests.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PW_EXPERIMENTAL_SERVICE_WORKER_NETWORK_EVENTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (not committed; no package.json in this repo)
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Projects — bottom tabs always work (candidate)
        run: node tests/browser/projects-tabs.test.mjs
      - name: Repeating tasks with no date come back (candidate)
        run: node tests/browser/undated-repeats.test.mjs
      - name: Fitness › Food — private calorie counter (candidate)
        run: node tests/browser/fitness-food.test.mjs
      - name: Fitness › Food — barcode scanner with a fake camera (candidate)
        run: node tests/browser/fitness-scan.test.mjs
      - name: Fitness › Food — search through Planly's food-search function (candidate)
        run: node tests/browser/fitness-search-proxy.test.mjs
      - name: Fitness › Food — one can or pack, ml, own serving size (candidate)
        run: node tests/browser/fitness-servings.test.mjs
      - name: Today — where a task is made, Show on Today, unscheduled count, completed after a week (candidate)
        run: node tests/browser/today-placement.test.mjs
      - name: Chores — no undated repeats, one-off restart of stalled chores, racing phones make one copy (candidate)
        run: node tests/browser/chore-restart.test.mjs
      - name: Update banner — Update while editing warns, then updates (candidate)
        run: node tests/browser/update-banner.test.mjs
      - name: Sync conflicts — combined automatically when safe; a real clash waits for a choice (candidate)
        run: node tests/browser/sync-conflicts.test.mjs
      - name: Household chores offline — partner's ticks and completions survive a restart and replay through the household RPCs (candidate)
        run: node tests/browser/household-offline.test.mjs
      - name: Budget tab — Me/Household, month bar, category, add/pay/delete, scroll kept, set-up card (candidate)
        run: node tests/browser/budget-tab.test.mjs
      - name: Render steps — every tab draws through its step, same-turn renders draw once, diagnostics opt-in (candidate)
        run: node tests/browser/render-steps.test.mjs
      - name: Budget totals after deleting — a deleted category's payments, a deleted or changed payment, Me and Household (candidate)
        run: node tests/browser/budget-delete.test.mjs
      - name: Task sheet sharing — Share and Assign, the sync-ready gate, read-only shared task, duplicate, foreground resume (candidate)
        run: node tests/browser/task-sharing.test.mjs
      - name: Household live updates — private channel join, broadcast brings the other phone's change in, leave on pagehide, rejoin on return (candidate)
        run: node tests/browser/household-live.test.mjs
      - name: Budget due date picker — quick days plus a calendar chip for any day, on Add and Edit payment (candidate)
        run: node tests/browser/budget-due-date.test.mjs
      - name: Budget scope colour — Me amber, Household violet, Budget tab only (candidate)
        run: node tests/browser/budget-scope-colour.test.mjs
      - name: Budget — What for first, Add a bill at the top, typing kept (candidate)
        run: node tests/browser/budget-forms.test.mjs
      - name: Look — colour band behind the title, glow behind every screen (candidate)
        run: node tests/browser/look-band.test.mjs
      - name: Today card — ring, counts, 100% celebration once a day (candidate)
        run: node tests/browser/today-card.test.mjs
      - name: Budget and Home cards — ring, counts, 🎉 when done, confetti once a week (candidate)
        run: node tests/browser/summary-cards.test.mjs
      - name: Timeline — week strip, stats, Anytime chips, the day as a list with free gaps and Now (candidate)
        run: node tests/browser/timeline.test.mjs
      - name: Projects — done tasks kept, refused save kept and retried, restore after delete kept (candidate)
        run: node tests/browser/project-sync.test.mjs
      - name: Projects list — colour, emoji, ring or status, days left, next task (candidate)
        run: node tests/browser/projects-list.test.mjs
      - name: Projects with the same id from two members — own status, next task and opening (candidate)
        run: node tests/browser/projects-owners.test.mjs
      - name: Project page — colour header, ring and counts, quick add, finish (candidate)
        run: node tests/browser/project-page.test.mjs
      - name: Project stages — grouped tasks, stage progress, quick add per stage, stage picker (candidate)
        run: node tests/browser/project-stages.test.mjs
      - name: Project board — List/Board switch, To do / Doing / Done, owner-only moves (candidate)
        run: node tests/browser/project-board.test.mjs
      - name: Add-task sheet — swipe down from anywhere to close, no blur while dragging (candidate)
        run: node tests/browser/sheet-swipe.test.mjs
      - name: Budget income edit — Save and ‹ Budget go back after typing (candidate)
        run: node tests/browser/budget-income-edit.test.mjs
      - name: Task Undo — bar goes away, Undo keeps newer tasks, held writes (candidate)
        run: node tests/browser/task-undo.test.mjs
      - name: Budget safety — double taps, drawing only on Budget, Budget tab goes home (candidate)
        run: node tests/browser/budget-safety.test.mjs
      - name: Lists and Projects keep typing, single saves, scroll position (candidate)
        run: node tests/browser/lists-projects-typing.test.mjs
      - name: Polish — task actions sheet swipe and scroll lock, Settings typing, invite double tap (candidate)
        run: node tests/browser/polish.test.mjs
      - name: Budget summary pills keep their text inside (candidate)
        run: node tests/browser/stat-pills.test.mjs
      - name: Glass tab bar floats with nothing showing under it (candidate)
        run: node tests/browser/glass-nav.test.mjs
      - name: Budget at a glance — due-in, overdue, what is left, today marker (candidate)
        run: node tests/browser/budget-glance.test.mjs
      - name: Today ring fills smoothly, then celebrates (candidate)
        run: node tests/browser/ring-fill.test.mjs
      - name: Budget sections open and close (candidate)
        run: node tests/browser/budget-folds.test.mjs
      - name: Deleting a repeating Google task — just this one or all repeats (candidate)
        run: node tests/browser/repeat-delete.test.mjs
      - name: Same test against the base branch (for comparison only; not a gate)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          mkdir -p "$RUNNER_TEMP/base" && git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/base"
          PLANLY_ROOT="$RUNNER_TEMP/base" node tests/browser/projects-tabs.test.mjs | tail -1 || true
          PLANLY_ROOT="$RUNNER_TEMP/base" node tests/browser/undated-repeats.test.mjs | tail -1 || true
