name: Patch update bootstrap
permissions:
  contents: write
on:
  push:
    branches: [fix/update-relaunch-n16]
    paths:
      - .github/workflows/patch-update-index.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-relaunch-n16
      - name: Patch index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v2/index.html')
          s=p.read_text()
          old="          if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});\n"
          if old not in s:
              raise SystemExit('legacy boot SKIP_WAITING marker not found')
          s=s.replace(old,'',1)
          old_sdk='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
          new_sdk='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script>'
          if old_sdk not in s:
              raise SystemExit('unpinned Supabase SDK marker not found')
          s=s.replace(old_sdk,new_sdk,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'planly-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v2/index.html
          git commit -m 'fix: remove boot activation race and pin Supabase SDK'
          git push origin HEAD:fix/update-relaunch-n16
